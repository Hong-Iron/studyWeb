[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "studyweb"
version = "0.1.0"
description = "A local, free, private web search + crawl + RAG toolkit — a self-hosted replacement for Tavily, with a drop-in API and LM Studio tool integration."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "studyweb contributors" }]
keywords = ["search", "crawler", "rag", "tavily", "llm", "lm-studio", "web-scraping"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
    "Topic :: Text Processing :: Markup :: HTML",
]
dependencies = [
    "requests>=2.28",
    "lxml>=4.9",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
studyweb = "studyweb.cli:main"

[project.urls]
Homepage = "https://github.com/your-org/studyweb"
Issues = "https://github.com/your-org/studyweb/issues"

[tool.setuptools]
packages = ["studyweb"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
