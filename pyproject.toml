[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "studyweb"
dynamic = ["version"]
description = "A local, free, private web search + crawl + RAG toolkit — a self-hosted replacement for Tavily, with a drop-in API and LM Studio tool integration."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "studyweb contributors" }]
keywords = ["search", "crawler", "rag", "tavily", "llm", "lm-studio", "web-scraping"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
    "Topic :: Text Processing :: Markup :: HTML",
]
dependencies = [
    "requests>=2.28",
    "lxml>=4.9",
]

[project.optional-dependencies]
dev = ["pytest>=7"]
# Stronger fetch transports (TLS-fingerprint impersonation, a real browser,
# anti-bot fingerprint spoofing) plus self-healing selectors for site adapters.
# Deliberately optional: studyweb's whole install is requests + lxml, and the
# engine ladder degrades to plain `static` when this is absent. Needs a one-off
# `scrapling install` afterwards to download the browsers.
scrapling = ["scrapling[fetchers]>=0.4"]
all = ["scrapling[fetchers]>=0.4"]

[project.scripts]
studyweb = "studyweb.cli:main"

[project.urls]
Homepage = "https://github.com/your-org/studyweb"
Issues = "https://github.com/your-org/studyweb/issues"

[tool.setuptools]
packages = ["studyweb"]

[tool.setuptools.dynamic]
version = { attr = "studyweb.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "C4"]
# BLE001 (blind except) is used deliberately at network/tool boundaries where
# every failure must be captured and reported rather than propagated.
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
# lxml has no stubs; the codebase is otherwise fully annotated.

